<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trading Bot Dashboard</title>
  <meta name="theme-color" content="#0b0d12" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Trading Bot Dashboard</h1>
    <button id="settings-btn" class="icon-btn" title="Einstellungen" aria-label="Einstellungen">⚙</button>
  </header>

  <div class="status-line">
    <span id="conn-dot" class="dot"></span>
    <span id="conn-text">Verbinde...</span>
  </div>

  <div id="error-banner"></div>

  <div class="export-row">
    <button id="export-btn" class="export-btn">Export für Steuerberater (CSV)</button>
    <select id="export-period" title="Zeitraum" aria-label="Zeitraum für den Export">
      <option value="all">Alle</option>
      <option value="week">Woche</option>
      <option value="month">Monat</option>
      <option value="year">Jahr</option>
    </select>
  </div>

  <main>
    <section class="zone" aria-labelledby="zone-uebersicht">
      <h2 class="zone-title" id="zone-uebersicht">Übersicht</h2>
      <div class="block hero-block" id="hero-block"></div>
      <div class="block" id="unrealized-block"></div>
      <div class="block" id="activity-block"></div>
    </section>

    <section class="zone" aria-labelledby="zone-bots">
      <h2 class="zone-title" id="zone-bots">Bots</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Zugang zum Dashboard</h2>
      <label for="input-token">Token</label>
      <input id="input-token" type="password" autocomplete="off" placeholder="Dashboard-Token" />

      <label for="input-base">Backend-URL (optional)</label>
      <input id="input-base" type="text" autocomplete="off" placeholder="z.B. https://bot.example.com" />
      <div class="hint">Leer lassen, wenn Frontend und Backend von derselben Adresse laufen.</div>

      <div id="login-error" class="login-error"></div>
      <button id="login-save">Speichern &amp; verbinden</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
